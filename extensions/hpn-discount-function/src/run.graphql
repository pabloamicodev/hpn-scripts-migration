query RunInput {
  cart {
    cost {
      subtotalAmount {
        amount
        currencyCode
      }
    }
    sourceAttribute: attribute(key: "source") {
      value
    }
    buyerIdentity {
      customer {
        numberOfOrders
        amountSpent {
          amount
          currencyCode
        }
      }
      email
    }
    lines {
      id
      quantity
      cost {
        totalAmount {
          amount
          currencyCode
        }
        amountPerQuantity {
          amount
          currencyCode
        }
      }
      sellingPlanAllocation {
        sellingPlan {
          id
        }
      }
      bundleTypeAttribute: attribute(key: "__bundle_type") {
        value
      }
      landingSourceAttribute: attribute(key: "__landing_source") {
        value
      }
      cartGiftTierAttribute: attribute(key: "__cart_gift_tier") {
        value
      }
      quizBundleIdAttribute: attribute(key: "_quiz_bundle_id") {
        value
      }
      quizTargetCentsAttribute: attribute(key: "_quiz_target_cents") {
        value
      }
      quizFreeGiftAttribute: attribute(key: "_quiz_free_gift") {
        value
      }
      quizExpectedPaidCountAttribute: attribute(key: "_quiz_expected_paid_count") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "hpn_scripts", key: "function_configuration") {
      value
    }
  }
}
