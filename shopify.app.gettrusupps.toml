# gettrusupps — dev config for gettrusupps.myshopify.com
# Usage: shopify app dev --config=gettrusupps
#
# Before first use:
#   1. Create a new app in partners.shopify.com for this store
#   2. Replace client_id below with the new app's Client ID
#   3. Update application_url if deploying to a separate URL
#   4. Set STORE_PROFILE=gettrusupps in the deployment env vars

name = "Script Migration App"
client_id = "819b1c9f7db3b989c8138940a6078afd"
handle = "hpn-scripts-migration"
application_url = "https://hpn-scripts-migration.vercel.app"
embedded = true

[access_scopes]
scopes = "write_discounts,read_products"

[auth]
redirect_urls = [
  "https://hpn-scripts-migration.vercel.app/auth/callback",
  "https://hpn-scripts-migration.vercel.app/api/auth/callback",
  "https://localhost:8081/auth/callback",
  "https://localhost:8081/api/auth/callback"
]

[app_proxy]
url = "https://hpn-scripts-migration.vercel.app/apps/cart-gift-tiers"
prefix = "apps"
subpath = "cart-gift-tiers"

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/webhooks"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "/webhooks"
